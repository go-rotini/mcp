version: 1.4.0
command:
  name: rotini-mcp
  summary: serve a rotini program's tools over MCP
  description: >-
    `rotini-mcp` serves the tool definitions a rotini program's tools feature writes
    (tools/mcp.json) as an MCP server on stdio, running the program for each call, and adds
    that server to MCP clients' configuration.
  footer: Use "rotini-mcp help <command>" for more information about a command.
  flags:
    - name: help
      identifiers: [-h, --help]
      summary: print help
      cascading: true
      short_circuit: true
      schema: { type: bool }
    - name: version
      identifiers: [--version]
      summary: print version
      cascading: true
      short_circuit: true
      schema: { type: bool }
  commands:
    - name: serve
      summary: serve a tools file over MCP on stdio
      description: >-
        Serve the tools in a tools file over MCP on stdio. Each call runs the program with the
        command line its arguments make, in the server's environment, and returns what it
        prints.
      examples:
        - rotini-mcp serve --tools tools/mcp.json --bin ./taskr
      flags:
        - name: tools
          summary: the tools file Rotini's tools feature writes
          identifiers: [--tools]
          schema: { type: existingfile, required: true }
        - name: bin
          summary: the program to run for each call
          identifiers: [--bin]
          schema: { type: string, required: true }
        - name: env
          summary: a variable to add to the program's environment (KEY=value)
          identifiers: [--env]
          schema: { type: '[]string' }
        - name: tool
          summary: serve only this tool
          identifiers: [--tool]
          schema: { type: '[]string' }
        - name: timeout
          summary: stop a call that runs longer than this (0 for no limit)
          identifiers: [--timeout]
          schema: { type: duration, default: 0s }
        - name: grace
          summary: how long a stopped call has between SIGTERM and being killed (0 kills it at once)
          identifiers: [--grace]
          schema: { type: duration, default: 5s }
        - name: output-limit
          summary: the most output a call may write on each of stdout and stderr
          identifiers: [--output-limit]
          schema: { type: bytesize, default: 10Mi }
        - name: concurrency
          summary: run at most this many calls at once; more wait their turn (0 for no limit)
          identifiers: [--concurrency]
          schema: { type: int, default: 0 }
        - name: revision
          summary: the MCP revision to serve the tools for
          identifiers: [--revision]
          schema: { type: string, enum: ['2026-07-28', '2025-11-25'], default: '2026-07-28' }
    - name: config
      summary: add, remove or list servers in an MCP client's configuration
      description: >-
        Add, remove or list MCP servers in an MCP client's configuration file. A file is backed
        up to <file>.bak before it is rewritten, replacing an earlier backup. The rewrite keeps
        every other setting, but comments are not kept.
      commands:
        - name: enable
          summary: add a server to a client's configuration
          description: >-
            Add a server to a client's configuration. With --tools and --bin, the client runs
            rotini-mcp serve for that program; with --command, it runs that command (such as a
            program that serves its own tools). The entry names this rotini-mcp executable, so
            run an installed rotini-mcp, not one from go run. --env values are written into the
            client's file, which for a project's file is often committed; keep secrets out of
            them. A --command or --bin path is written as an absolute path. A server already in the
            file keeps its other settings. The file is backed up to <file>.bak, and comments in it
            are not kept.
          examples:
            - rotini-mcp config enable claude-desktop taskr --tools tools/mcp.json --bin ./taskr
            - rotini-mcp config enable cursor taskr --command taskr --arg mcp
          arguments:
            - name: client
              summary: the client
              schema: { type: string, required: true, enum: [claude-desktop, claude-code, cursor, vscode] }
            - name: name
              summary: the server's name in the client
              schema: { type: string, required: true }
          flags:
            - name: tools
              summary: the tools file to serve
              identifiers: [--tools]
              schema: { type: existingfile }
            - name: bin
              summary: the program to run for each call; a path, or a name on PATH
              identifiers: [--bin]
              schema: { type: string }
            - name: command
              summary: the command the client runs instead of rotini-mcp serve
              identifiers: [--command]
              schema: { type: string }
            - name: arg
              summary: an argument for --command
              identifiers: [--arg]
              schema: { type: '[]string' }
            - name: env
              summary: a variable the client sets for the server (KEY=value)
              identifiers: [--env]
              schema: { type: '[]string' }
            - name: scope
              summary: the user's file or the project's (by default the client's first)
              identifiers: [--scope]
              schema: { type: string, enum: [user, project] }
        - name: disable
          summary: remove a server from a client's configuration
          description: >-
            Remove a server from a client's configuration. The file is backed up to <file>.bak,
            and comments in it are not kept.
          arguments:
            - name: client
              summary: the client
              schema: { type: string, required: true, enum: [claude-desktop, claude-code, cursor, vscode] }
            - name: name
              summary: the server's name in the client
              schema: { type: string, required: true }
          flags:
            - name: scope
              summary: the user's file or the project's (by default the client's first)
              identifiers: [--scope]
              schema: { type: string, enum: [user, project] }
        - name: list
          summary: list the servers in a client's configuration
          arguments:
            - name: client
              summary: the client
              schema: { type: string, required: true, enum: [claude-desktop, claude-code, cursor, vscode] }
          flags:
            - name: scope
              summary: the user's file or the project's (by default the client's first)
              identifiers: [--scope]
              schema: { type: string, enum: [user, project] }
    - name: help
      summary: print help
      description: Print help for a command.
      arguments:
        - name: command
          summary: the command path to print help for
          schema: { type: '[]string', complete: { kind: command } }
    - name: version
      summary: print version
      description: Print the rotini-mcp version.
