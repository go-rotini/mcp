version: 1.11.0
generate:
  packages:
    - type: main
      file: cmd/rotini-mcp/main.go
      package: main
    - type: cmd
      file: internal/cmd/rotinimcp/zz_rotini.go
      package: rotinimcp
      hook_returns: error
  features:
    - type: help
      enabled: true
    - type: completion
      enabled: false
    - type: man
      enabled: false
    - type: markdown
      enabled: false
validate:
  fail: collect
