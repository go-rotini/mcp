version: 1.4.0
command:
  name: taskr
  summary: keep a list of tasks
  env_prefix: TASKR
  response_files: { prefix: "+" }
  flags:
    - name: verbose
      summary: say more
      identifiers: [-v, --verbose]
      cascading: true
      schema: { type: count }
    - name: json
      summary: print JSON
      identifiers: [--json]
      cascading: true
      role: machine-output
      schema: { type: bool }
  commands:
    - name: add
      summary: add a task
      effects: { kind: write }
      arguments:
        - name: title
          summary: what to do
          schema: { type: string, required: true }
      flags:
        - name: tag
          summary: tags for the task
          identifiers: [--tag]
          schema: { type: '[]string' }
        - name: priority
          summary: how urgent it is
          identifiers: [--priority]
          schema: { type: string, enum: [low, high], default: low }
        - name: done
          summary: add it as done
          identifiers: [--done]
          schema: { type: bool, negatable: true, default: true }
        - name: label
          summary: labels for the task
          identifiers: [--label]
          schema: { type: 'map[string]string' }
        - name: note
          summary: a note, or @file to read it from a file
          identifiers: [--note]
          agent: true
          schema: { type: string, from: [value, file] }
        - name: token
          summary: the account token
          identifiers: [--token]
          agent: true
          schema: { type: string, secret: true }
      output:
        type: object
        required: [title]
        properties:
          title: { type: string }
          tags: { type: '[]string' }
          priority: { type: string }
          done: { type: bool }
          verbose: { type: int }
          label: { type: 'map[string]string' }
          note: { type: string }
          token: { type: bool }
    - name: run
      summary: run a script with its arguments
      agent: true
      effects: { kind: read }
      arguments:
        - name: script
          summary: the script
          schema: { type: string, required: true }
        - name: args
          summary: the script's arguments
          passthrough: true
          schema: { type: '[]string' }
      output:
        type: object
        required: [script, args]
        properties:
          script: { type: string }
          args: { type: '[]string' }
    - name: exec
      summary: run a command as typed
      agent: true
      effects: { kind: read }
      passthrough: true
      arguments:
        - name: argv
          summary: the command and its arguments
          schema: { type: '[]string' }
      output:
        type: object
        required: [argv]
        properties:
          argv: { type: '[]string' }
          json: { type: bool }
          verbose: { type: int }
    - name: conf
      summary: set settings
      effects: { kind: write }
      arguments:
        - name: keys
          summary: the keys to touch, comma-separated
          schema: { type: '[]string', separator: ',' }
      flags:
        - name: set
          summary: settings to set, with dotted keys
          identifiers: [--set]
          schema: { type: map, dotted_keys: true }
      output:
        type: object
        required: [keys, set]
        properties:
          keys: { type: '[]string' }
          set: { type: object }
    - name: fail
      summary: fail on purpose
      effects: { kind: read }
    - name: mcp
      summary: serve the tools over MCP
      agent: false
