name: Bug Report
description: Report a bug in go-rotini/mcp
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: tool
    attributes:
      label: Tool Definition
      description: |
        The tool from tools/mcp.json the call went to, including its
        `_meta["dev.rotini/invoke"]` facts.
      render: json

  - type: textarea
    id: call
    attributes:
      label: Call
      description: |
        The tools/call arguments the client sent. Redact secret values —
        replace them with `<redacted>`.
      render: json

  - type: textarea
    id: setup
    attributes:
      label: How the Server Runs
      description: The `rotini-mcp serve` command line, or the `mcp.Serve` call and its options.
      render: text

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: The call's result, and anything the program wrote on stderr.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: go-rotini/mcp and go-rotini/rotini versions (e.g., v0.1.0, v1.4.0)
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP Client
      description: The client and the protocol revision it negotiated, if known
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Output of `go version`
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / Platform
      description: Linux / macOS / Windows; matters for how a cancelled call is stopped
    validations:
      required: true
