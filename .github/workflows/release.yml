name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: go-rotini/.github/.github/workflows/go-release.yml@main
    with:
      majors: "0 1"
      initial-development: true
