version: "2"

linters:
  default: all
  disable:
    # Deprecated
    - wsl

    # Not applicable to this project
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx
    - spancheck
    - zerologlint
    - loggercheck
    - promlinter
    - protogetter
    - ginkgolinter
    - testifylint
    - sloglint
    - unqueryvet
    - arangolint
    - gosmopolitan

    # Too opinionated for this project
    - exhaustruct
    - exhaustruct_v5
    - varnamelen
    - wsl_v5
    - nlreturn
    - noinlineerr
    - godox
    - depguard
    - goheader
    - gomodguard
    - lll
    - gochecknoglobals
    - ireturn
    - nonamedreturns
    - paralleltest
    - tparallel
    - testpackage
    - mnd
    - funcorder
    - tagliatelle     # JSON keys follow the MCP and rotini document formats
    - forbidigo
    - exhaustive
    - recvcheck
    - err113          # errors carry their own messages; callers read ArgvError by type
    - goconst

  settings:
    cyclop:
      max-complexity: 25

    gocognit:
      min-complexity: 40

    gocyclo:
      min-complexity: 25

    funlen:
      lines: 120
      statements: 80
      ignore-comments: true

    nestif:
      min-complexity: 10

    goconst:
      min-len: 5
      min-occurrences: 5

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - unnamedResult

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming

    errcheck:
      check-type-assertions: false
      check-blank: true
      exclude-functions:
        # AsType returns (E, bool); the bool is the check.
        - errors.AsType
        # Closing a handle on a cleanup path has nothing to do on failure.
        - golang.org/x/sys/windows.CloseHandle

    gosec:
      excludes:
        - G304        # the tools file and client config paths are the caller's
        - G204        # running the configured program is the point
        - G115
        - G301        # client config directories are created like their clients create them

    nakedret:
      max-func-lines: 10

    misspell:
      locale: US

    interfacebloat:
      max: 5

    wrapcheck:
      ignore-interface-regexps:
        - "io\\.Writer"
      ignore-sig-regexps:
        - "TextUnmarshaler\\)\\.UnmarshalText"
        - "TextMarshaler\\)\\.MarshalText"
        - "io\\.Writer\\)\\.Write"
      ignore-package-globs:
        - "strconv"
        - "encoding/base64"
        - "encoding/json"
        - "encoding/json/v2"

    perfsprint:
      strconcat: false

    godot:
      scope: toplevel

    maintidx:
      under: 15

    prealloc:
      simple: true
      for-loops: true

  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - forcetypeassert
          - dupl
          - cyclop
          - gocognit
          - gocyclo
          - funlen
          - goconst
          - maintidx
          - wrapcheck
          - err113
          - exhaustive
          - makezero
          - unparam
          - nestif
          - godot
          - gocritic
          - prealloc
          - perfsprint
          - errorlint
          - inamedparam
          - embeddedstructfieldcheck
          - modernize
          - unconvert
          - revive
          - misspell
          - intrange
          - testableexamples
          - staticcheck
          - tagalign
          - errchkjson

      - path: internal/cmd/
        linters:
          - wrapcheck

      - path: cmd/
        linters:
          - errcheck
          - gosec

      - path: clients/
        linters:
          - gosec       # the config paths are the clients' own, chosen by the caller

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
